name: Step 4 formatting repair artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install exact formatter
        run: python -m pip install ruff==0.16.5
      - name: Remove synthetic secret-scan false positive
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("labs/middleware_telnexa/certify.py")
          text = path.read_text(encoding="utf-8")
          old = '"idempotency_key": "stage4-idempotency-0001"'
          new = '"idempotency_key": "test-test-test-test"'
          if old not in text:
              raise SystemExit("expected synthetic idempotency fixture not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Apply Ruff fixes and formatting
        run: |
          python -m ruff check --fix \
            billing/sms_provider_*.py \
            labs/middleware_telnexa \
            scripts/validate_step4_sms_contract_lock.py \
            tests/test_sms_provider_runtime.py \
            tests/test_sms_provider_service.py
          python -m ruff format \
            billing/sms_provider_*.py \
            labs/middleware_telnexa \
            scripts/validate_step4_sms_contract_lock.py \
            tests/test_sms_provider_runtime.py \
            tests/test_sms_provider_service.py
          python -m ruff check \
            billing/sms_provider_*.py \
            labs/middleware_telnexa \
            scripts/validate_step4_sms_contract_lock.py \
            tests/test_sms_provider_runtime.py \
            tests/test_sms_provider_service.py
          python -m ruff format --check \
            billing/sms_provider_*.py \
            labs/middleware_telnexa \
            scripts/validate_step4_sms_contract_lock.py \
            tests/test_sms_provider_runtime.py \
            tests/test_sms_provider_service.py
      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: telnexa-step4-formatted-source
          if-no-files-found: error
          retention-days: 1
          path: |
            billing/sms_provider_*.py
            labs/middleware_telnexa/*.py
            scripts/validate_step4_sms_contract_lock.py
            tests/test_sms_provider_runtime.py
            tests/test_sms_provider_service.py
