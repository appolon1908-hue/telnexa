name: Step 4 formatting repair commit

on:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  format-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install exact formatter
        run: python -m pip install ruff==0.16.5
      - name: Remove synthetic secret-scan false positive
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("labs/middleware_telnexa/certify.py")
          text = path.read_text(encoding="utf-8")
          old = '"idempotency_key": "stage4-idempotency-0001"'
          new = '"idempotency_key": "test-test-test-test"'
          if old not in text and new not in text:
              raise SystemExit("expected synthetic idempotency fixture not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Apply and verify Ruff fixes
        run: |
          python -m ruff check --fix \
            billing/sms_provider_*.py \
            labs/middleware_telnexa \
            scripts/validate_step4_sms_contract_lock.py \
            tests/test_sms_provider_runtime.py \
            tests/test_sms_provider_service.py
          python -m ruff format \
            billing/sms_provider_*.py \
            labs/middleware_telnexa \
            scripts/validate_step4_sms_contract_lock.py \
            tests/test_sms_provider_runtime.py \
            tests/test_sms_provider_service.py
          python -m ruff check \
            billing/sms_provider_*.py \
            labs/middleware_telnexa \
            scripts/validate_step4_sms_contract_lock.py \
            tests/test_sms_provider_runtime.py \
            tests/test_sms_provider_service.py
          python -m ruff format --check \
            billing/sms_provider_*.py \
            labs/middleware_telnexa \
            scripts/validate_step4_sms_contract_lock.py \
            tests/test_sms_provider_runtime.py \
            tests/test_sms_provider_service.py
      - name: Remove one-use repair workflow
        run: rm .github/workflows/step4-format-artifact.yml
      - name: Commit exact repair to pull request branch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            billing/sms_provider_*.py \
            labs/middleware_telnexa/*.py \
            scripts/validate_step4_sms_contract_lock.py \
            tests/test_sms_provider_runtime.py \
            tests/test_sms_provider_service.py
          git add -u .github/workflows/step4-format-artifact.yml
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "style(step4): apply exact Ruff and secret-scan repair"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
