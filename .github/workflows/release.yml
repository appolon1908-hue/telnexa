name: Immutable production release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  test-build-scan:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/telnexa-billing
    steps:
      - uses: actions/checkout@v5

      - name: Reject committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git --redact --no-banner /repo

      - name: Run automated tests
        run: |
          docker build --pull -t telnexa-ci:${{ github.sha }} -f billing/Dockerfile .
          docker run --rm -v "$PWD:/src:ro" -w /src --entrypoint pytest \
            telnexa-ci:${{ github.sha }} -q

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image with attestations
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: billing/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true

      - name: Scan immutable image
        run: |
          docker run --rm aquasec/trivy:0.67.2 image \
            --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Generate release SBOM and checksums
        run: |
          docker run --rm anchore/syft:v1.33.0 \
            "${IMAGE}@${{ steps.build.outputs.digest }}" \
            -o cyclonedx-json > sbom.cdx.json
          printf '%s\n' '${{ github.sha }}' > SOURCE_SHA
          printf '%s\n' '${{ steps.build.outputs.digest }}' > IMAGE_DIGEST
          sha256sum SOURCE_SHA IMAGE_DIGEST sbom.cdx.json > SHA256SUMS

      - name: Upload certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: telnexa-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            SOURCE_SHA
            IMAGE_DIGEST
            sbom.cdx.json
            SHA256SUMS
