name: Codestra identity and webhook contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: telnexa-codestra-identity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate-source:
    name: validate-source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: billing/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r billing/requirements.txt ruff

      - name: Check identity and webhook source
        run: |
          python -m ruff format --check billing/oidc.py docker/webhook-relay/server.py tests/test_oidc_contract.py tests/test_webhook_relay.py
          python -m ruff check billing/oidc.py docker/webhook-relay/server.py tests/test_oidc_contract.py tests/test_webhook_relay.py
          python -m pytest -q tests/test_oidc_contract.py tests/test_webhook_relay.py

      - name: Render canonical Codestra identity override
        env:
          RABBITMQ_USER: ci
          RABBITMQ_PASSWORD: ci-placeholder
          REDIS_PASSWORD: ci-placeholder
          JASMIN_ADMIN_PASSWORD: ci-placeholder
          JASMIN_API_PASSWORD: ci-placeholder
          WEBHOOK_HMAC_SECRET: ci-placeholder
          BILLING_DB_PASSWORD: ci-placeholder
          BILLING_ADMIN_TOKEN: ci-placeholder
          BILLING_JWT_SECRET: ci-placeholder-value-with-required-length
          BILLING_MIDDLEWARE_API_KEY: ci-placeholder
          BILLING_MIDDLEWARE_HMAC_SECRET: ci-placeholder
          GRAFANA_ADMIN_PASSWORD: ci-placeholder
          OIDC_ALLOWED_AZP: middleware-api,monitoring-readonly
          TELNEXA_METRICS_TOKEN_FILE: /tmp/ci-metrics-token
          KEYCLOAK_ADMIN_PASSWORD_FILE: /tmp/ci-keycloak-admin
          KEYCLOAK_DB_PASSWORD_FILE: /tmp/ci-keycloak-db
          TELNEXA_PROVIDER_KEYS_FILE: /tmp/ci-provider-keys
          TELNEXA_GATEWAY_CLIENT_SECRET_FILE: /tmp/ci-telnexa-client-secret
          TELNEXA_MIDDLEWARE_WEBHOOK_HMAC_FILE: /tmp/ci-telnexa-webhook-hmac
          TELNEXA_MIDDLEWARE_CA_FILE: /tmp/ci-middleware-ca
          TELNEXA_MIDDLEWARE_CLIENT_CERT_FILE: /tmp/ci-middleware-cert
          TELNEXA_MIDDLEWARE_CLIENT_KEY_FILE: /tmp/ci-middleware-key
        run: docker compose -f docker-compose.yml -f docker-compose.codestra-identity.yml config --quiet

  validate-merge-result:
    name: validate-merge-result
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Check out exact merge-result SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Verify exact merge-result identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: billing/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r billing/requirements.txt ruff

      - name: Check identity and webhook merge result
        run: |
          python -m ruff format --check billing/oidc.py docker/webhook-relay/server.py tests/test_oidc_contract.py tests/test_webhook_relay.py
          python -m ruff check billing/oidc.py docker/webhook-relay/server.py tests/test_oidc_contract.py tests/test_webhook_relay.py
          python -m pytest -q tests/test_oidc_contract.py tests/test_webhook_relay.py

      - name: Render canonical Codestra identity override
        env:
          RABBITMQ_USER: ci
          RABBITMQ_PASSWORD: ci-placeholder
          REDIS_PASSWORD: ci-placeholder
          JASMIN_ADMIN_PASSWORD: ci-placeholder
          JASMIN_API_PASSWORD: ci-placeholder
          WEBHOOK_HMAC_SECRET: ci-placeholder
          BILLING_DB_PASSWORD: ci-placeholder
          BILLING_ADMIN_TOKEN: ci-placeholder
          BILLING_JWT_SECRET: ci-placeholder-value-with-required-length
          BILLING_MIDDLEWARE_API_KEY: ci-placeholder
          BILLING_MIDDLEWARE_HMAC_SECRET: ci-placeholder
          GRAFANA_ADMIN_PASSWORD: ci-placeholder
          OIDC_ALLOWED_AZP: middleware-api,monitoring-readonly
          TELNEXA_METRICS_TOKEN_FILE: /tmp/ci-metrics-token
          KEYCLOAK_ADMIN_PASSWORD_FILE: /tmp/ci-keycloak-admin
          KEYCLOAK_DB_PASSWORD_FILE: /tmp/ci-keycloak-db
          TELNEXA_PROVIDER_KEYS_FILE: /tmp/ci-provider-keys
          TELNEXA_GATEWAY_CLIENT_SECRET_FILE: /tmp/ci-telnexa-client-secret
          TELNEXA_MIDDLEWARE_WEBHOOK_HMAC_FILE: /tmp/ci-telnexa-webhook-hmac
          TELNEXA_MIDDLEWARE_CA_FILE: /tmp/ci-middleware-ca
          TELNEXA_MIDDLEWARE_CLIENT_CERT_FILE: /tmp/ci-middleware-cert
          TELNEXA_MIDDLEWARE_CLIENT_KEY_FILE: /tmp/ci-middleware-key
        run: docker compose -f docker-compose.yml -f docker-compose.codestra-identity.yml config --quiet
