name: telnexa

x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

x-security: &default-security
  security_opt:
    - no-new-privileges:true

services:
  keycloak-db:
    image: postgres:17.6-alpine@sha256:d5f196a551b5cef1c70853c6dd588f456d16ca4ea733e3f31c75bc1ae2f65f3f
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets: [keycloak_db_password]
    volumes: [keycloak-db-data:/var/lib/postgresql/data]
    networks: [identity]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    build: {context: ., dockerfile: docker/keycloak/Dockerfile}
    image: telnexa/keycloak:26.6.3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/bash","-ec"]
    command:
      - >-
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)";
        export KC_DB_PASSWORD="$$(cat /run/secrets/keycloak_db_password)";
        exec /opt/keycloak/bin/kc.sh start --optimized --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: telnexa-bootstrap
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: https://api.telnexa.co/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    secrets: [keycloak_admin_password,keycloak_db_password]
    volumes: [./config/keycloak/telnexa-realm.json:/opt/keycloak/data/import/telnexa-realm.json:ro]
    ports: ["127.0.0.1:18082:8080"]
    networks: [identity,public,monitoring]
    depends_on: {keycloak-db: {condition: service_healthy}}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '\"status\".*\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 2g
    cpus: 2

  keycloak-configure:
    image: telnexa/keycloak:26.6.3
    restart: "no"
    entrypoint: ["/opt/telnexa/keycloak-configure.sh"]
    secrets: [keycloak_admin_password]
    volumes:
      - ./scripts/keycloak-configure.sh:/opt/telnexa/keycloak-configure.sh:ro
      - ./config/keycloak/user-profile.json:/opt/telnexa/user-profile.json:ro
    networks: [identity]
    depends_on: {keycloak: {condition: service_healthy}}
  rabbitmq:
    image: rabbitmq:3.13-alpine@sha256:d7af1c87c5f1eda13fcfca06db452bf3aeab6619fc3358b68535c0c02c4e52bc
    restart: unless-stopped
    <<: *default-security
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    expose: ["5672"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    logging: *default-logging
    mem_limit: 4g
    cpus: 4

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    <<: *default-security
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["/bin/sh", "/usr/local/bin/start-redis"]
    volumes:
      - redis-data:/data
      - ./config/redis/redis.conf:/etc/redis/redis.conf:ro
      - ./scripts/redis-entrypoint.sh:/usr/local/bin/start-redis:ro
    expose: ["6379"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging
    mem_limit: 2g
    cpus: 2

  jasmin:
    build:
      context: .
      dockerfile: docker/jasmin/Dockerfile
      args:
        JASMIN_IMAGE: ${JASMIN_IMAGE:-jookies/jasmin:0.11.0@sha256:3f049692d22fd66ab08a55073f79db96fe442473ede9615e8ac085ac505a1064}
    image: telnexa/jasmin:${TELNEXA_IMAGE_TAG:-local}
    restart: unless-stopped
    <<: *default-security
    depends_on:
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      AMQP_BROKER_HOST: rabbitmq
      AMQP_BROKER_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      REDIS_CLIENT_HOST: redis
      REDIS_CLIENT_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JASMIN_ADMIN_USER: ${JASMIN_ADMIN_USER:-telnexa-admin}
      JASMIN_ADMIN_PASSWORD: ${JASMIN_ADMIN_PASSWORD:?set JASMIN_ADMIN_PASSWORD in .env}
      JASMIN_API_USER: ${JASMIN_API_USER:-middleware}
      JASMIN_API_PASSWORD: ${JASMIN_API_PASSWORD:?set JASMIN_API_PASSWORD in .env}
      JASMIN_API_GROUP: ${JASMIN_API_GROUP:-telnexa-api}
      JASMIN_HTTP_THROUGHPUT: ${JASMIN_HTTP_THROUGHPUT:-20}
      JASMIN_SMPPS_THROUGHPUT: ${JASMIN_SMPPS_THROUGHPUT:-20}
    volumes:
      - jasmin-config:/etc/jasmin
      - jasmin-logs:/var/log/jasmin
    expose: ["1401", "2775", "8990"]
    networks: [backend, edge, egress]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/telnexa-ready && python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:1401/ping', timeout=4)\""]
      interval: 20s
      timeout: 8s
      retries: 15
      start_period: 40s
    logging: *default-logging
    mem_limit: 8g
    cpus: 6

  webhook-relay:
    build:
      context: .
      dockerfile: docker/webhook-relay/Dockerfile
    image: telnexa/webhook-relay:${TELNEXA_IMAGE_TAG:-local}
    restart: unless-stopped
    <<: *default-security
    environment:
      WEBHOOK_TARGET_BASE_URL: ${WEBHOOK_TARGET_BASE_URL:-}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:?set WEBHOOK_HMAC_SECRET in .env}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-10}
    expose: ["8080"]
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging: *default-logging
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 1

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: telnexa/nginx:${TELNEXA_IMAGE_TAG:-local}
    restart: unless-stopped
    <<: *default-security
    depends_on:
      jasmin: {condition: service_healthy}
      webhook-relay: {condition: service_healthy}
    environment:
      SMS_DOMAIN: ${SMS_DOMAIN:-sms.telnexa.co}
      API_DOMAIN: ${API_DOMAIN:-api.telnexa.co}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-app.telnexa.co}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.telnexa.co}
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - acme-webroot:/var/www/certbot:ro
    networks: [edge, public, billing]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging: *default-logging
    mem_limit: 512m
    cpus: 2

  billing-db:
    image: postgres:17.6-alpine@sha256:d5f196a551b5cef1c70853c6dd588f456d16ca4ea733e3f31c75bc1ae2f65f3f
    restart: unless-stopped
    <<: *default-security
    environment:
      POSTGRES_DB: ${BILLING_DB_NAME:-telnexa_billing}
      POSTGRES_USER: ${BILLING_DB_USER:-telnexa_billing}
      POSTGRES_PASSWORD: ${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD in .env}
    volumes: [billing-db-data:/var/lib/postgresql/data]
    expose: ["5432"]
    networks: [billing]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    mem_limit: 2g
    cpus: 2

  billing-migrate:
    build: {context: ., dockerfile: billing/Dockerfile}
    image: telnexa/billing:${TELNEXA_IMAGE_TAG:-local}
    command: ["python", "-m", "billing.migrate"]
    restart: "no"
    environment: &billing-environment
      BILLING_DATABASE_URL: postgresql+psycopg://${BILLING_DB_USER:-telnexa_billing}:${BILLING_DB_PASSWORD}@billing-db:5432/${BILLING_DB_NAME:-telnexa_billing}
      BILLING_JWT_SECRET: ${BILLING_JWT_SECRET:?set BILLING_JWT_SECRET in .env}
      BILLING_ADMIN_TOKEN: ${BILLING_ADMIN_TOKEN:?set BILLING_ADMIN_TOKEN in .env}
      BILLING_MIDDLEWARE_URL: ${BILLING_MIDDLEWARE_URL:-https://10.40.0.1/api/v1/events/telnexa}
      BILLING_MIDDLEWARE_API_KEY: ${BILLING_MIDDLEWARE_API_KEY:?set BILLING_MIDDLEWARE_API_KEY in .env}
      BILLING_MIDDLEWARE_HMAC_SECRET: ${BILLING_MIDDLEWARE_HMAC_SECRET:?set BILLING_MIDDLEWARE_HMAC_SECRET in .env}
      BILLING_SIMULATOR_ENABLED: ${BILLING_SIMULATOR_ENABLED:-true}
      OIDC_ISSUER: https://api.telnexa.co/auth/realms/telnexa
      OIDC_AUDIENCE: telnexa-api
      SOURCE_SHA: ${SOURCE_SHA:-uncommitted}
      LIVE_SMS_DELIVERY: "false"
      LIVE_EMAIL_DELIVERY: "false"
      LIVE_PSTN_DIALING: "false"
    depends_on: {billing-db: {condition: service_healthy}}
    networks: [billing]

  billing-api:
    build: {context: ., dockerfile: billing/Dockerfile}
    image: telnexa/billing:${TELNEXA_IMAGE_TAG:-local}
    restart: unless-stopped
    <<: *default-security
    environment: *billing-environment
    entrypoint: ["/usr/local/bin/live-gate"]
    command: ["uvicorn", "billing.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    volumes:
      - ./scripts/live-gate.sh:/usr/local/bin/live-gate:ro
    depends_on:
      billing-db: {condition: service_healthy}
      billing-migrate: {condition: service_completed_successfully}
    expose: ["8000"]
    ports: ["127.0.0.1:18080:8000"]
    networks: [billing, edge, public, monitoring]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging: *default-logging
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1g
    cpus: 2

  billing-worker:
    build: {context: ., dockerfile: billing/Dockerfile}
    image: telnexa/billing:${TELNEXA_IMAGE_TAG:-local}
    command: ["python", "-m", "billing.worker"]
    entrypoint: ["/usr/local/bin/live-gate"]
    volumes:
      - ./scripts/live-gate.sh:/usr/local/bin/live-gate:ro
    restart: unless-stopped
    <<: *default-security
    environment: *billing-environment
    depends_on:
      billing-db: {condition: service_healthy}
      billing-migrate: {condition: service_completed_successfully}
    networks: [billing, egress]
    read_only: true
    tmpfs: [/tmp]
    logging: *default-logging
    mem_limit: 512m
    cpus: 1

  certbot:
    image: certbot/certbot:v4.2.0@sha256:9626d72120577cf72da4fc7948806e9993598981720a4cbe04340a502468d67b
    profiles: ["tls"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/certbot
    networks: [egress]

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    <<: *default-security
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    expose: ["9090"]
    networks: [monitoring, billing]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *default-logging
    mem_limit: 2g
    cpus: 2

  node-exporter:
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    restart: unless-stopped
    <<: *default-security
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    expose: ["9100"]
    networks: [monitoring]
    logging: *default-logging
    mem_limit: 256m
    cpus: 1

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    <<: *default-security
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-telnexa-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-monitoring.telnexa.co}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    expose: ["3000"]
    networks: [monitoring]
    depends_on: [prometheus]
    logging: *default-logging
    mem_limit: 512m
    cpus: 1

networks:
  backend:
    internal: true
  edge:
    internal: true
  monitoring:
    internal: true
  billing:
    internal: true
  public: {}
  egress: {}
  identity:
    internal: true

volumes:
  rabbitmq-data:
  redis-data:
  jasmin-config:
  jasmin-logs:
  letsencrypt:
  acme-webroot:
  prometheus-data:
  grafana-data:
  billing-db-data:
  keycloak-db-data:

secrets:
  keycloak_admin_password: {file: ./.secrets/keycloak_admin_password}
  keycloak_db_password: {file: ./.secrets/keycloak_db_password}
