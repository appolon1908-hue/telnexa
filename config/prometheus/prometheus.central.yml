global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: production
    service: telnexa
    codestra_business: telnexa
    owner: appolon1908-hue
    prometheus: telnexa-provider
rule_files:
- /etc/prometheus/alerts.yml
scrape_configs:
- job_name: billing-api
  authorization:
    credentials_file: /run/secrets/telnexa_metrics_token
  static_configs:
  - targets:
    - billing-api:8000
- job_name: prometheus
  static_configs:
  - targets:
    - prometheus:9090
- job_name: node
  static_configs:
  - targets:
    - node-exporter:9100
alerting:
  alertmanagers:
  - scheme: https
    api_version: v2
    timeout: 10s
    tls_config:
      ca_file: /run/secrets/alertmanager_ca
      cert_file: /run/secrets/alertmanager_client_cert
      key_file: /run/secrets/alertmanager_client_key
      server_name: alertmanager.core.codestra.internal
      insecure_skip_verify: false
    static_configs:
    - targets:
      - 10.40.0.1:19093
