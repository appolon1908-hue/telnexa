groups:
- name: telnexa-production
  rules:
  - alert: TelnexaApiDown
    expr: up{job="billing-api"} == 0
    for: 2m
    labels:
      severity: critical
      environment: production
      service: telnexa
      codestra_business: telnexa
      owner: appolon1908-hue
    annotations:
      summary: Telnexa API is unavailable
      description: Telnexa API is unavailable. Inspect the provider metrics and event
        ledger using the runbook; verify recovery before replaying queued work.
      runbook_url: https://github.com/appolon1908-hue/telnexa/blob/main/docs/ALERT_ROUTING.md
  - alert: TelnexaNodeExporterDown
    expr: up{job="node"} == 0
    for: 5m
    labels:
      severity: warning
      environment: production
      service: telnexa
      codestra_business: telnexa
      owner: appolon1908-hue
    annotations:
      summary: Telnexa host telemetry is unavailable
      description: Telnexa host telemetry is unavailable. Inspect the provider metrics
        and event ledger using the runbook; verify recovery before replaying queued
        work.
      runbook_url: https://github.com/appolon1908-hue/telnexa/blob/main/docs/ALERT_ROUTING.md
  - alert: TelnexaApiSendFailures
    expr: increase(telnexa_billing_sends_total{status="rejected"}[5m]) > 10
    labels:
      severity: warning
      environment: production
      service: telnexa
      codestra_business: telnexa
      owner: appolon1908-hue
    annotations:
      summary: Telnexa rejected more than ten sends in five minutes
      description: Telnexa rejected more than ten sends in five minutes. Inspect the
        provider metrics and event ledger using the runbook; verify recovery before
        replaying queued work.
      runbook_url: https://github.com/appolon1908-hue/telnexa/blob/main/docs/ALERT_ROUTING.md
  - alert: TelnexaDiskSpaceLow
    expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})
      < 0.15
    for: 10m
    labels:
      severity: critical
      environment: production
      service: telnexa
      codestra_business: telnexa
      owner: appolon1908-hue
    annotations:
      summary: Telnexa root filesystem has less than 15% free
      description: Telnexa root filesystem has less than 15% free. Inspect the provider
        metrics and event ledger using the runbook; verify recovery before replaying
        queued work.
      runbook_url: https://github.com/appolon1908-hue/telnexa/blob/main/docs/ALERT_ROUTING.md
  - alert: TelnexaSmsDispatchBacklog
    expr: telnexa_sms_dispatch_oldest_seconds > 300
    for: 5m
    labels:
      severity: critical
      environment: production
      service: telnexa
      codestra_business: telnexa
      owner: appolon1908-hue
    annotations:
      summary: The durable SMS dispatch queue is older than five minutes
      description: The durable SMS dispatch queue is older than five minutes. Inspect
        the provider metrics and event ledger using the runbook; verify recovery before
        replaying queued work.
      runbook_url: https://github.com/appolon1908-hue/telnexa/blob/main/docs/ALERT_ROUTING.md
  - alert: TelnexaSmsProviderCircuitOpen
    expr: telnexa_sms_provider_circuit_state > 0
    for: 2m
    labels:
      severity: warning
      environment: production
      service: telnexa
      codestra_business: telnexa
      owner: appolon1908-hue
    annotations:
      summary: An SMS provider circuit is open
      description: An SMS provider circuit is open. Inspect the provider metrics and
        event ledger using the runbook; verify recovery before replaying queued work.
      runbook_url: https://github.com/appolon1908-hue/telnexa/blob/main/docs/ALERT_ROUTING.md
  - alert: TelnexaSmsSubmissionUnknown
    expr: increase(telnexa_sms_submission_unknown_total[5m]) > 0
    labels:
      severity: critical
      environment: production
      service: telnexa
      codestra_business: telnexa
      owner: appolon1908-hue
    annotations:
      summary: An ambiguous SMS submission requires reconciliation
      description: An ambiguous SMS submission requires reconciliation. Inspect the
        provider metrics and event ledger using the runbook; verify recovery before
        replaying queued work.
      runbook_url: https://github.com/appolon1908-hue/telnexa/blob/main/docs/ALERT_ROUTING.md
  - alert: TelnexaSmsUnmatchedProviderEvents
    expr: telnexa_sms_unmatched_provider_events > 0
    for: 2m
    labels:
      severity: critical
      environment: production
      service: telnexa
      codestra_business: telnexa
      owner: appolon1908-hue
    annotations:
      summary: Provider events cannot be authoritatively correlated
      description: Provider events cannot be authoritatively correlated. Inspect the
        provider metrics and event ledger using the runbook; verify recovery before
        replaying queued work.
      runbook_url: https://github.com/appolon1908-hue/telnexa/blob/main/docs/ALERT_ROUTING.md
  - alert: TelnexaSmsBillingDrift
    expr: telnexa_sms_billing_reconciliation_drift > 0
    for: 2m
    labels:
      severity: critical
      environment: production
      service: telnexa
      codestra_business: telnexa
      owner: appolon1908-hue
    annotations:
      summary: SMS billing reconciliation drift was detected
      description: SMS billing reconciliation drift was detected. Inspect the provider
        metrics and event ledger using the runbook; verify recovery before replaying
        queued work.
      runbook_url: https://github.com/appolon1908-hue/telnexa/blob/main/docs/ALERT_ROUTING.md
  - alert: TelnexaSmsCanaryExhausted
    expr: telnexa_sms_canary_remaining == 0
    for: 1m
    labels:
      severity: warning
      environment: production
      service: telnexa
      codestra_business: telnexa
      owner: appolon1908-hue
    annotations:
      summary: An enabled SMS canary has no remaining submissions
      description: An enabled SMS canary has no remaining submissions. Inspect the
        provider metrics and event ledger using the runbook; verify recovery before
        replaying queued work.
      runbook_url: https://github.com/appolon1908-hue/telnexa/blob/main/docs/ALERT_ROUTING.md
