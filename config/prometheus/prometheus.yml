global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: billing-api
    static_configs:
      - targets: ["billing-api:8000"]
  - job_name: prometheus
    static_configs: [{targets: ["prometheus:9090"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
